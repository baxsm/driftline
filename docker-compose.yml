services:
  postgres:
    image: postgres:18-alpine
    container_name: driftline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline
    ports:
      - "5435:5432"
    volumes:
      - driftline-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline -d driftline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  driftline-pgdata:
